# pyproject.toml
# ============================================================================
# This file defines the project metadata, dependencies, and build system.
# It follows PEP 621 (standard metadata) and PEP 660 (editable installs).
# ============================================================================

[build-system]
# Tells pip which tool to use for building the package.
# setuptools is the most widely-used, battle-tested build backend.
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# --- Core Metadata ---
name = "ai-scraper"
version = "1.0.0"
description = "Production-grade AI data collection pipeline that scrapes, cleans, enriches, and outputs AI-ready document objects."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

# Author information shown on PyPI and in metadata
authors = [
    {name = "Ayush Sanghavi", email = "ayushksanghavi@gmail.com"},
]


# --- Dependencies ---
# These are installed automatically when someone does `pip install .`
dependencies = [
    # HTTP library
    # We use it for all HTTP GET calls with timeout and retry support.
    "requests>=2.31.0,<3.0.0",

    # HTML parser
    # We use it to parse HTML DOM, extract text, strip tags, find links.
    # Our default content extraction algorithm is built on top of this.
    "beautifulsoup4>=4.12.0,<5.0.0",

    # Fast HTML/XML parser backend for BeautifulSoup.
    # Much faster than the built-in html.parser; used in production systems.
    "lxml>=5.0.0,<6.0.0",

    # Production-grade content extraction (alternative parser backend).
    # Used by HuggingFace, IBM, Microsoft Research for building AI datasets.
    # Enabled via --parser trafilatura flag.
    "trafilatura>=2.0.0,<3.0.0",

    # Language detection
    # Returns ISO 639-1 codes like 'en', 'es', 'fr'.
    "langdetect>=1.0.9,<2.0.0",
]

# --- Optional Dependencies ---
# Installed with: pip install ".[dev]" or pip install ".[analytics]"
[project.optional-dependencies]
# Development tools — only needed by contributors, not end users
dev = [
    "pytest>=7.4.0,<9.0.0",         # Test framework
    "pytest-cov>=4.1.0,<6.0.0",     # Coverage reporting for tests
    "ruff>=0.4.0,<1.0.0",           # Linter + formatter (replaces flake8+black+isort)
]
# Analytics dependencies — only needed if you run the analysis script
analytics = [
    "pandas>=2.1.0,<3.0.0",         # Data analysis
    "tabulate>=0.9.0,<1.0.0",       # Pretty-print tables in terminal
]

# --- CLI Entry Point ---
# This creates a command-line tool called `scrape_site` that you can run
# from anywhere after installing the package.
# When someone types `scrape_site`, Python calls the `main()` function
# inside `src/ai_scraper/cli.py`.
[project.scripts]
scrape_site = "ai_scraper.cli:main"

# --- Tool Configuration ---

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Which directories to scan
src = ["src", "tests"]

# Pytest configuration
[tool.pytest.ini_options]
# Tell pytest where to find tests and source code
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
